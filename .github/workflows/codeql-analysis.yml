name: CodeQL

on:
  push:
    branches: [master, '202[0-9][0-9][0-9]']
  pull_request:
    branches: [master, '202[0-9][0-9][0-9]']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: Analyze native source (cpp, AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      DEBIAN_FRONTEND: noninteractive
      BAZELISK_GITHUB_TOKEN: ""
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SONIC_BAZEL_REGISTRY_REVISION: 46428f1a59a3988f603bd3f3165136fd4d8c1960
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils binutils-gold build-essential ca-certificates curl file git patch pkg-config python3 tar unzip xz-utils zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          cache-version: "8.5.1"
      - name: Select the review catalog
        run: python3 tools/bazel/prepare_ci.py
      - name: Verify evidence and shallow-checkout guards
        run: python3 -B tools/bazel/evidence_test.py
      - name: Audit and prepare source-independent tools and libraries
        run: |
          test "$(uname -m)" = x86_64
          output_base="$(mktemp -d "$RUNNER_TEMP/linkmgrd-codeql.XXXXXX")"
          printf 'LINKMGRD_CODEQL_OUTPUT_BASE=%s\n' "$output_base" >> "$GITHUB_ENV"
          export LINKMGRD_CODEQL_OUTPUT_BASE="$output_base"
          bash tools/bazel/codeql_build.sh prepare
      - name: Initialize manual C++ extraction
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: cpp
          build-mode: manual
          db-location: ${{ runner.temp }}/linkmgrd-codeql-db
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.0/codeql-bundle-linux64.tar.gz
      - name: Compile Linkmgrd under tracing
        run: bash tools/bazel/codeql_build.sh trace
      - name: Analyze compiled C++
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:cpp
      - name: Verify extracted owner definitions and source bytes
        run: |
          python3 tools/bazel/codeql_coverage.py \
            --codeql "$CODEQL_DIST/codeql" \
            --database "$RUNNER_TEMP/linkmgrd-codeql-db/cpp" \
            --output bazel-evidence/codeql-owner-coverage.json
      - name: Retain source extraction evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkmgrd-codeql-owner-coverage-amd64
          path: bazel-evidence/codeql-owner-coverage.json
          if-no-files-found: error

  python:
    name: Analyze Python acceptance helpers
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: python
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:python
